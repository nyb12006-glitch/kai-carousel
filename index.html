<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KAI — Carrusel SEO</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background:#010508;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 16px 40px;
  font-family:'Rajdhani',sans-serif;
}
h1 { font-size:1.5rem; letter-spacing:0.5em; font-weight:300; color:#fff; margin-bottom:2px; }
.sub { font-size:0.52rem; letter-spacing:0.28em; color:#2a4a70; text-transform:uppercase; margin-bottom:20px; font-family:'Share Tech Mono',monospace; }

.wrap { width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px; }

/* Canvas display */
.canvas-wrap { border:1px solid #0d1e30; border-radius:4px; overflow:hidden; width:100%; }
canvas { width:100%; display:block; }
canvas#display { cursor:pointer; }

/* Controls */
.nav { display:flex; gap:10px; align-items:center; justify-content:center; }
.btn {
  background:none;
  border:1px solid rgba(60,100,150,0.3);
  border-radius:3px;
  color:rgba(100,160,220,0.7);
  font-family:'Share Tech Mono',monospace;
  font-size:0.6rem;
  letter-spacing:0.15em;
  padding:10px 16px;
  cursor:pointer;
  transition:all 0.2s;
}
.btn:disabled { color:rgba(40,70,110,0.3); border-color:rgba(30,50,80,0.2); cursor:default; }
.btn-dl {
  background:linear-gradient(135deg,#0a2a18,#1a5030);
  border:1px solid #1a4028;
  color:rgba(160,210,255,1);
  text-shadow:0 0 12px rgba(80,160,255,0.9);
  width:100%;
  padding:13px;
  font-size:0.65rem;
}
.counter { font-family:'Share Tech Mono',monospace; font-size:0.52rem; letter-spacing:0.2em; color:rgba(110,165,220,0.95); }
.hint { font-size:0.5rem; color:#1a3050; letter-spacing:0.15em; text-align:center; font-family:'Share Tech Mono',monospace; }
</style>
</head>
<body>

<h1>KAI</h1>
<p class="sub">Carrusel · 5 razones SEO</p>

<div class="wrap">
  <div class="canvas-wrap">
    <canvas id="display" width="1080" height="1080"></canvas>
  </div>

  <div class="nav">
    <button class="btn" id="prev">← ANT</button>
    <span class="counter" id="counter">1 / 7</span>
    <button class="btn" id="next">SIG →</button>
  </div>

  <button class="btn btn-dl" id="dl">↓ DESCARGAR SLIDE JPG</button>
  <p class="hint">1080 × 1080 · Listo para Instagram</p>
</div>

<script>
const GLOW = "0 0 12px rgba(80,160,255,0.9), 0 0 30px rgba(60,130,240,0.6), 0 0 60px rgba(40,100,220,0.3)";

const slides = [
  { type:"cover", headline:"5 RAZONES POR LAS QUE\nNECESITAS SEO", sub:"Y por qué sin él, tu negocio es invisible.", tag:"KAI · POSICIONAMIENTO" },
  { type:"statement", number:"01", headline:"Ahora mismo alguien busca\nlo que tú vendes.\nY le está pagando a otro.", body:"Cada segundo sin SEO es una oportunidad que se lleva tu competencia." },
  { type:"statement", number:"02", headline:"Tu competencia ya\nestá posicionada.", body:"Cada día que pasas sin SEO es un cliente que se lleva otro." },
  { type:"stat", number:"03", stat:"24/7", headline:"el SEO trabaja mientras tú duermes", body:"Sin pagar por cada clic. Sin apagar campañas. Sin límites." },
  { type:"statement", number:"04", headline:"Los anuncios paran.\nEl SEO no.", body:"Pagas una vez, construyes autoridad para siempre." },
  { type:"statement", number:"05", headline:"Estás pagando para que te vean.\nEl SEO hace que te busquen.", body:"Deja de depender de los anuncios. Construye visibilidad que no se apaga." },
  { type:"cta", headline:"¿Tu negocio merece estar\nen la primera página?", sub:"Escríbenos por DM y lo hablamos.", tag:"KAI · DISEÑO WEB · SEO · REDES" },
];

let current = 0;
const W = 1080, H = 1080;
const canvas = document.getElementById("display");
const ctx = canvas.getContext("2d");

function navyBg() {
  const g = ctx.createRadialGradient(W*0.8,H*0.1,10,W/2,H/2,W);
  g.addColorStop(0,"#1a3560"); g.addColorStop(0.5,"#0f2040"); g.addColorStop(1,"#0a1428");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function coverBg() {
  const g = ctx.createRadialGradient(W*0.8,H*0.1,10,W/2,H/2,W);
  g.addColorStop(0,"#0a1628"); g.addColorStop(0.5,"#060d1a"); g.addColorStop(1,"#020609");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawGeometry() {
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = "rgba(80,160,255,0.9)"; ctx.lineWidth = 2;
  // Top right triangle
  ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(W,H*0.42); ctx.lineTo(W*0.56,0); ctx.closePath(); ctx.stroke();
  // Bottom left triangle
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(W*0.28,H); ctx.lineTo(0,H*0.7); ctx.closePath(); ctx.stroke();
  // Diagonal
  ctx.strokeStyle="rgba(80,140,230,0.5)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(W,0); ctx.stroke();
  // Horizontal lines
  ctx.strokeStyle="rgba(80,140,230,0.35)"; ctx.lineWidth=1;
  [H*0.33,H*0.66].forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();});
  // Corner brackets TL
  ctx.strokeStyle="rgba(100,170,255,0.8)"; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(50,100); ctx.lineTo(50,50); ctx.lineTo(100,50); ctx.stroke();
  // Corner brackets BR
  ctx.beginPath(); ctx.moveTo(W-50,H-100); ctx.lineTo(W-50,H-50); ctx.lineTo(W-100,H-50); ctx.stroke();
  // Diamond center
  ctx.strokeStyle="rgba(100,170,255,0.55)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(W/2,H/2-20); ctx.lineTo(W/2+20,H/2); ctx.lineTo(W/2,H/2+20); ctx.lineTo(W/2-20,H/2); ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawTopBar(slide) {
  // Progress dots
  const dotW = 14, gap = 6, startX = 50;
  slides.forEach((_, i) => {
    ctx.fillStyle = i === current ? "rgba(120,180,240,0.8)" : "rgba(60,100,150,0.3)";
    ctx.fillRect(startX + i*(dotW+gap), 50, i===current?dotW*1.8:dotW*0.5, 4);
  });
  // KAI label
  ctx.font = "300 22px 'Share Tech Mono',monospace";
  ctx.fillStyle = "rgba(60,100,150,0.6)";
  ctx.textAlign = "right";
  ctx.fillText("KAI", W-50, 68);
}

function drawGlowText(text, x, y, size, color, glow, align="left", maxW=900, glowStrength=80) {
  ctx.save();
  ctx.font = `300 ${size}px 'Rajdhani',sans-serif`;
  ctx.fillStyle = color;
  ctx.shadowColor = "rgba(80,160,255,0.9)";
  ctx.shadowBlur = glow ? glowStrength : 0;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  const lines = text.split("\n");
  lines.forEach((line,i) => ctx.fillText(line, x, y + i*(size*1.3)));
  ctx.restore();
  return lines.length * (size*1.3);
}

function drawMonoText(text, x, y, size, color, glow=false) {
  ctx.save();
  ctx.font = `${size}px 'Share Tech Mono',monospace`;
  ctx.fillStyle = color;
  ctx.shadowColor = "rgba(80,160,255,0.8)";
  ctx.shadowBlur = glow ? 60 : 0;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawLine(x1,y1,x2,y2,color,w=1) {
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}

function drawSlide(slide) {
  slide.type === "cover" ? coverBg() : navyBg();
  drawGeometry();
  drawTopBar(slide);

  const L = 80, R = W-80;
  const midY = H/2;

  if(slide.type === "cover") {
    drawLine(L, midY-160, L+60, midY-160, "rgba(100,180,255,0.8)", 2);
    let y = midY - 140;
    // Double pass for extra glow on headline
    drawGlowText(slide.headline, L, y, 68, "rgba(255,255,255,0.15)", true, "left", 900, 140);
    y += drawGlowText(slide.headline, L, y, 68, "#ffffff", true, "left", 900, 110);
    y += 40;
    drawGlowText(slide.sub, L, y, 34, "rgba(160,210,255,1)", true, "left", 900, 100);
    drawMonoText(slide.tag, L, H-80, 22, "rgba(110,165,220,0.95)");
  }

  if(slide.type === "statement") {
    drawMonoText(`0${slide.number} ──`, L, H*0.25, 24, "rgba(110,175,240,1)");
    let y = H*0.25 + 50;
    y += drawGlowText(slide.headline, L, y, 62, "#e0eaf5", false, "left");
    y += 30;
    drawLine(L, y, L+80, y, "rgba(80,150,230,0.25)", 1.5);
    y += 30;
    drawGlowText(slide.body, L, y, 32, "rgba(160,210,255,1)", true, "left");
  }

  if(slide.type === "stat") {
    drawMonoText(`0${slide.number} ──`, L, H*0.2, 24, "rgba(110,175,240,1)");
    // Big stat
    ctx.save();
    ctx.font = "100 200px 'Rajdhani',sans-serif";
    ctx.fillStyle = "rgba(180,225,255,1)";
    ctx.shadowColor = "rgba(100,180,255,1)";
    ctx.shadowBlur = 120;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText(slide.stat, L-10, H*0.26);
    ctx.restore();
    let y = H*0.26 + 220;
    drawGlowText(slide.headline, L, y, 42, "#c0d8f0", false, "left");
    y += 70;
    drawLine(L, y, W-80, y, "rgba(60,100,150,0.15)", 1);
    y += 30;
    drawGlowText(slide.body, L, y, 32, "rgba(160,210,255,1)", true, "left");
  }

  if(slide.type === "cta") {
    drawLine(L, midY-160, L+60, midY-160, "rgba(80,150,230,0.5)", 2);
    let y = midY - 140;
    y += drawGlowText(slide.headline, L, y, 62, "#e0eaf5", false, "left");
    y += 40;
    drawGlowText(slide.sub, L, y, 34, "rgba(160,210,255,1)", true, "left");
    y += 70;
    // DM line
    ctx.save();
    ctx.strokeStyle = "rgba(160,210,255,0.5)";
    ctx.shadowColor = "rgba(80,160,255,0.6)";
    ctx.shadowBlur = 8;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(L,y+16); ctx.lineTo(L+60,y+16); ctx.stroke();
    ctx.restore();
    drawMonoText("DM ABIERTO →", L+80, y, 26, "rgba(160,210,255,1)", true);
    drawMonoText(slide.tag, L, H-80, 22, "rgba(110,165,220,0.95)");
  }

  // Bottom line
  drawLine(L, H-50, W*0.4, H-50, "rgba(110,165,220,0.55)", 1);
  drawMonoText(`${current+1} / ${slides.length}`, W-80, H-68, 20, "rgba(110,165,220,0.85)");
}

function render() {
  drawSlide(slides[current]);
  document.getElementById("counter").textContent = `${current+1} / ${slides.length}`;
  document.getElementById("prev").disabled = current === 0;
  document.getElementById("next").disabled = current === slides.length-1;
}

function download() {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/jpeg", 0.95);
  a.download = `kai-seo-slide-${current+1}.jpg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.getElementById("prev").onclick = () => { current = Math.max(0, current-1); render(); };
document.getElementById("next").onclick = () => { current = Math.min(slides.length-1, current+1); render(); };
document.getElementById("dl").onclick = download;

// Wait for fonts
function init() {
  if(document.fonts.check("300 62px 'Rajdhani'") && document.fonts.check("24px 'Share Tech Mono'")) {
    render();
  } else {
    setTimeout(init, 100);
  }
}
window.onload = init;
</script>
</body>
</html>
